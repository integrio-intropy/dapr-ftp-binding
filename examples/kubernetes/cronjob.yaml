# A CronJob that runs the binding and daprd as Kubernetes native sidecars (init
# containers with restartPolicy: Always). The kubelet starts the binding first,
# starts daprd once the binding's socket exists, starts the app, and stops both
# sidecars when the app has exited. The pod's result is the app's exit code.
#
# Needs Kubernetes 1.29 or later. Tested with Dapr 1.19.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ftp-job-demo
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            dapr.io/enabled: "true"
            dapr.io/app-id: "ftp-job-demo"
            # Dapr injects daprd as a native sidecar. The injector appends it to
            # initContainers, so it comes after the binding declared below.
            dapr.io/enable-native-sidecar: "true"
            # The binding below replaces the injected one. Dapr cannot inject a
            # component in front of a native daprd (dapr/dapr#10778).
            dapr.io/inject-pluggable-components: "false"
            # daprd looks for component sockets in this folder (its default).
            dapr.io/volume-mounts: "dapr-components-sockets:/tmp/dapr-components-sockets"
        spec:
          restartPolicy: Never
          initContainers:
            - name: ftp-binding
              image: harbor.intropy.io/platform/dapr-ftp-binding:v0.1.0
              restartPolicy: Always
              # No -exit-when-idle: the kubelet stops a native sidecar.
              # daprd reads the socket folder once, at startup. The probe holds
              # daprd and the app back until the binding listens.
              startupProbe:
                exec:
                  command: ["test", "-S", "/tmp/dapr-components-sockets/ftp.sock"]
                periodSeconds: 1
                failureThreshold: 60
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - name: dapr-components-sockets
                  mountPath: /tmp/dapr-components-sockets
          containers:
            - name: app
              image: your-registry/your-job:latest
          volumes:
            - name: dapr-components-sockets
              emptyDir: {}
