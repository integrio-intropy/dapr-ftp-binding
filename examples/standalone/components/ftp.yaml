apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: ftp
spec:
  # The socket file name (ftp.sock) is what makes this bindings.ftp.
  type: bindings.ftp
  version: v1
  metadata:
    - name: address
      value: "localhost:2121"
    - name: username
      value: "ftpuser"
    # In production use a secret reference rather than a literal:
    #   secretKeyRef:
    #     name: ftp-credentials
    #     key: password
    - name: password
      value: "ftppass"
    # Required. fileName is joined to this path
    - name: rootPath
      value: "/upload"
    # none | explicit | implicit. Certificate verification is on by default.
    - name: tlsMode
      value: "none"
    - name: timeout
      value: "30s"
    - name: maxConnections
      value: "5"
    # Optional, off by default. Upload to "<name>.tmp" and rename it onto the
    # requested name, so a partner polling this folder never picks up a file
    # mid-upload. Needs a server that supports RNFR/RNTO -- most do, but it is
    # not required by RFC 959 and FEAT does not advertise it, so confirm first.
    # - name: tempFileNamePattern
    #   value: "{name}.tmp"
    # Optional, off by default. Create the directories under rootPath that a
    # create needs, instead of failing when they are missing. Only tried after
    # an upload has actually been refused, and never outside rootPath.
    # - name: createDirs
    #   value: "true"
